[package]
name = "folkengine"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A folksonomy domain kernel: a poly-hierarchical tag vocabulary, (tagger, item, tag) bindings, and per-actor selections — pure, delivery-agnostic, no I/O."
license = "MIT OR Apache-2.0"
repository = "https://github.com/folkengine/folkengine"
keywords = ["folksonomy", "tags", "tagging", "ontology", "domain-kernel"]
categories = ["data-structures"]

[features]
# Pure by default: `cargo add folkengine` yields the kernel and nothing else.
default = []
# Opt-in serde derives on every public type. `serde` is a trait crate, not a
# format; concrete formats (serde_json, serde_yaml, …) stay in the shell.
serde = ["dep:serde"]
# Umbrella for examples, docs and `cargo test --features full`.
full = ["serde"]

[dependencies]
serde = { version = "1", features = ["derive", "std"], optional = true, default-features = false }

[dev-dependencies]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
# Pedantic exceptions that fight readability in a value-heavy kernel.
module_name_repetitions = "allow"
must_use_candidate = "allow"
